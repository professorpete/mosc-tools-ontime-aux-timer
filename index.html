<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AUX Timer — Ontime</title>
<style>
  :root {
    --bg: #101010;
    --fg: #f5f5f4;
    --dim: #8a8a86;
    --accent-now: #3b82f6;
    --accent-next: #6b7280;
    --warn: #ffbc00;
    --danger: #ff4b3e;
    --paused: #ffbc00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: Arial, "Helvetica Neue", Helvetica, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body.hide-cursor { cursor: none; }

  /* ---------- Main timer ---------- */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5vh;
    padding-top: 8vh; /* optical centering below the top cue bar */
  }

  #timer {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    white-space: nowrap;
    transition: color 0.3s ease;
  }

  #timer.paused { animation: pulse 1.6s ease-in-out infinite; color: var(--paused); }
  #timer.stopped { color: var(--dim); }
  #timer.warning { color: var(--warn); }
  #timer.overtime { color: var(--danger); }
  #timer.finished { animation: flash 1s step-end infinite; color: var(--danger); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ---------- Timer + secondary messages ---------- */
  #message {
    display: none;
    max-width: 92vw;
    text-align: center;
    font-size: clamp(22px, 6.5vh, 84px);
    font-weight: 700;
    line-height: 1.25;
    color: var(--fg);
  }
  #secondary {
    display: none;
    max-width: 92vw;
    text-align: center;
    font-size: clamp(16px, 4.2vh, 58px);
    font-weight: 600;
    line-height: 1.25;
    color: #b9b9b4;
  }

  /* ---------- Blink / blackout (Ontime message controls) ---------- */
  body.blink #stage,
  body.blink footer,
  body.blink #status { animation: blinkAll 1s step-end infinite; }
  @keyframes blinkAll { 50% { opacity: 0; } }

  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 50;
  }
  body.blackout #blackout { opacity: 1; }

  /* ---------- Logo + rundown name ---------- */
  #logo {
    position: fixed;
    bottom: 1.8vh;
    left: 1.4vw;
    height: 13.8vh;
    width: auto;
    opacity: 0.9;
    user-select: none;
    -webkit-user-drag: none;
  }

  #rundown {
    position: fixed;
    bottom: 2.6vh;
    right: 1.6vw;
    max-width: 34vw;
    font-size: clamp(11px, 1.4vh, 18px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: none;
  }

  /* ---------- Status pill ---------- */
  #status {
    position: fixed;
    bottom: 2.6vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(11px, 1.4vh, 18px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 0.6em;
    opacity: 0.9;
    user-select: none;
  }

  #status .dot {
    width: 0.65em; height: 0.65em;
    border-radius: 50%;
    background: var(--danger);
    flex: none;
  }
  #status.connected .dot { background: #35da8c; }
  #status.demo .dot { background: var(--warn); }

  /* ---------- Footer: NOW / NEXT ---------- */
  footer {
    position: fixed;
    left: 0; right: 0; top: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 4vw;
    padding: 3vh 3.2vw 0 3.2vw;
  }

  .cue-block { max-width: 46vw; min-width: 0; }
  .cue-block.next { text-align: right; }

  .cue-label {
    font-size: clamp(12px, 1.9vh, 24px);
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 1vh;
    user-select: none;
  }

  .cue-line {
    display: flex;
    align-items: center;
    gap: 0.55em;
    min-width: 0;
  }
  .cue-block.next .cue-title { text-align: right; }
  .cue-countdown { margin-left: 0.15em; }
  .cue-block.next .cue-line { justify-content: flex-end; }

  .cue-number {
    font-size: clamp(18px, 4.4vh, 56px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    flex: none;
    padding: 0.05em 0.35em;
    border-radius: 0.15em;
    background: var(--accent-next);
  }
  .cue-block.now .cue-number { background: var(--accent-now); }

  .cue-title {
    font-size: clamp(16px, 3.6vh, 46px);
    font-weight: 600;
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cue-block.next .cue-title { color: #c9c9c5; }

  /* Master countdown of the running segment / duration of the next one */
  .cue-countdown {
    font-size: clamp(18px, 4.4vh, 56px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    flex: none;
    display: none;
  }
  .cue-countdown.on { display: inline; }
  /* Discreet: no warning/danger colors, no flashing. Past zero it counts
     up with a minus sign and fades to grey. */
  .cue-countdown.negative { color: #9a9a96; }
  .cue-block.next .cue-countdown { color: var(--dim); font-weight: 400; }

  .cue-block.empty .cue-number { display: none; }
  .cue-block.empty .cue-title { color: var(--dim); font-style: normal; }

  /* ---------- Hint overlay ---------- */
  #hint {
    position: fixed;
    top: 6.5vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(11px, 1.6vh, 16px);
    color: var(--dim);
    text-align: center;
    line-height: 1.6;
    display: none;
    user-select: none;
  }
  #hint code { color: #c9c9c5; font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>

(() => {
  'use strict';

  /* =========================================================
   * CONFIG — via URL params:
   *   ?server=192.168.1.10:4001   Ontime server (host:port).
   *                               Defaults to the host serving this
   *                               page (perfect when dropped into
   *                               Ontime's "external" folder),
   *                               otherwise localhost:4001.
   *   ?aux=1|2|3                  Which auxiliary timer (default 1).
   *   ?demo=1                     Simulated data, no server needed.
   * ========================================================= */
  const params = new URLSearchParams(window.location.search);
  const AUX_KEY = 'auxtimer' + (['1','2','3'].includes(params.get('aux')) ? params.get('aux') : '1');
  const IS_HTTPS = window.location.protocol === 'https:';
  // Default to the Ontime machine on the show network; override with ?server=
  const DEFAULT_SERVER = '10.1.1.100:4001';
  const SERVER = (params.get('server') || DEFAULT_SERVER).replace(/^wss?:\/\//, '').replace(/\/+$/, '');
  // A page served over https cannot open an insecure ws:// connection,
  // so fall back to demo mode there (used for hosted previews).
  const DEMO = params.get('demo') === '1' || (IS_HTTPS && !params.get('server'));
  const WS_URL = (IS_HTTPS ? 'wss://' : 'ws://') + SERVER + '/ws';

  /* ---------- DOM ---------- */
  const $timer = document.getElementById('timer');
  const $status = document.getElementById('status');
  const $statusText = document.getElementById('statusText');
  const $hint = document.getElementById('hint');
  const $nowBlock = document.getElementById('nowBlock');
  const $nowCue = document.getElementById('nowCue');
  const $nowTitle = document.getElementById('nowTitle');
  const $nextBlock = document.getElementById('nextBlock');
  const $nextCue = document.getElementById('nextCue');
  const $nextTitle = document.getElementById('nextTitle');
  const $nowCountdown = document.getElementById('nowCountdown');
  const $nextCountdown = document.getElementById('nextCountdown');
  const $message = document.getElementById('message');
  const $secondary = document.getElementById('secondary');
  const $rundown = document.getElementById('rundown');

  /* ---------- State ---------- */
  const state = {
    connected: false,
    aux: { duration: 0, current: 0, playback: 'stop', direction: 'count-down' },
    auxReceivedAt: 0,   // performance.now() when aux data last arrived
    eventNow: null,
    eventNext: null,
    // master timer of the running segment (TimerState)
    timer: { current: null, phase: 'none', playback: 'stop' },
    timerReceivedAt: 0,
    // message feature: { timer: {text, visible, blink, blackout, secondarySource}, secondary }
    message: { timer: { text: '', visible: false, blink: false, blackout: false, secondarySource: null }, secondary: '' },
  };

  /* ---------- Helpers ---------- */
  function formatMs(ms) {
    const negative = ms < 0;
    const abs = Math.abs(ms);
    const totalSeconds = Math.floor(abs / 1000);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    const pad = (n) => String(n).padStart(2, '0');
    const body = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    return (negative ? '−' : '') + body;
  }

  function fitTimer(text, shrink) {
    // Scale so the string always fits: cap by width and height.
    const widthCap = (92 / (text.length * 0.60));  // vw units
    let size = Math.min(widthCap, 58);             // never taller than ~58vw
    let vhCap = 62;
    if (shrink) { size *= 0.72; vhCap = 42; }      // leave room for messages
    $timer.style.fontSize = `min(${size}vw, ${vhCap}vh)`;
  }

  function setStatus(text, cls) {
    $statusText.textContent = text;
    $status.className = cls;
  }

  function renderCue(block, cueEl, titleEl, event, emptyText) {
    if (event && (event.title || event.cue)) {
      block.classList.remove('empty');
      cueEl.textContent = event.cue || '';
      cueEl.style.display = event.cue ? '' : 'none';
      titleEl.textContent = event.title || 'Untitled';
      if (event.colour) cueEl.style.background = event.colour;
      else cueEl.style.background = '';
    } else {
      block.classList.add('empty');
      cueEl.textContent = '';
      titleEl.textContent = emptyText;
    }
  }

  /* ---------- Render loop (interpolates between server updates) ---------- */
  function currentAuxMs() {
    const { current, playback, direction } = state.aux;
    if (playback !== 'start') return current;
    const elapsed = performance.now() - state.auxReceivedAt;
    return direction === 'count-up' ? current + elapsed : current - elapsed;
  }

  function currentMasterMs() {
    const { current, playback } = state.timer;
    if (current === null || current === undefined) return null;
    if (playback !== 'play' && playback !== 'roll') return current;
    return current - (performance.now() - state.timerReceivedAt);
  }

  let lastFitKey = '';

  function render() {
    const ms = currentAuxMs();
    const { playback, direction } = state.aux;

    // Messages below the main clock
    const mt = state.message.timer || {};
    const showMsg = !!(mt.visible && mt.text && mt.text.trim());
    const secondaryText = state.message.secondary || '';
    const showSec = !!(secondaryText.trim() &&
      (mt.secondarySource === 'secondary' || mt.secondarySource === 'external'));

    $message.style.display = showMsg ? 'block' : 'none';
    if (showMsg) $message.textContent = mt.text;
    $secondary.style.display = showSec ? 'block' : 'none';
    if (showSec) $secondary.textContent = secondaryText;

    // Blink / blackout follow Ontime's message controls
    document.body.classList.toggle('blink', !!mt.blink);
    document.body.classList.toggle('blackout', !!mt.blackout);

    // Stopped (or no data yet): show dashes instead of the idle duration
    const idle = playback === 'stop' || ms === null || ms === undefined;
    const text = idle ? '–:––' : formatMs(ms);
    const fitKey = text.length + '|' + (showMsg || showSec);
    if ($timer.textContent !== text || fitKey !== lastFitKey) {
      $timer.textContent = text;
      fitTimer(text, showMsg || showSec);
      lastFitKey = fitKey;
    }

    // Visual state
    $timer.className = '';
    if (playback === 'stop') {
      $timer.classList.add('stopped');
    } else if (playback === 'pause') {
      $timer.classList.add('paused');
    } else if (direction === 'count-down') {
      if (ms < 0) $timer.classList.add('finished');
      else if (ms <= 60_000) $timer.classList.add('overtime');   // last minute: red
      else if (ms <= 3 * 60_000) $timer.classList.add('warning'); // last 3 min: amber
    }

    renderCue($nowBlock, $nowCue, $nowTitle, state.eventNow, 'No event running');
    renderCue($nextBlock, $nextCue, $nextTitle, state.eventNext, 'End of rundown');

    // Master countdown of the running segment, beside the NOW cue
    const masterMs = currentMasterMs();
    if (state.eventNow && masterMs !== null && state.timer.playback !== 'stop') {
      $nowCountdown.textContent = formatMs(masterMs);
      $nowCountdown.className = 'cue-countdown on';
      if (masterMs < 0) $nowCountdown.classList.add('negative');
    } else {
      $nowCountdown.className = 'cue-countdown';
    }

    // Scheduled duration of the upcoming segment, beside the NEXT cue
    if (state.eventNext && typeof state.eventNext.duration === 'number') {
      $nextCountdown.textContent = formatMs(state.eventNext.duration);
      $nextCountdown.className = 'cue-countdown on';
    } else {
      $nextCountdown.className = 'cue-countdown';
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  /* ---------- Store updates (v4 and v3 compatible) ---------- */
  function applyStore(partial) {
    if (!partial || typeof partial !== 'object') return;
    if (AUX_KEY in partial && partial[AUX_KEY]) {
      state.aux = partial[AUX_KEY];
      state.auxReceivedAt = performance.now();
    }
    if ('eventNow' in partial) state.eventNow = partial.eventNow;
    if ('eventNext' in partial) state.eventNext = partial.eventNext;
    if ('timer' in partial && partial.timer) {
      state.timer = partial.timer;
      state.timerReceivedAt = performance.now();
    }
    if ('message' in partial && partial.message) {
      const m = partial.message;
      state.message = {
        timer: { ...state.message.timer, ...(m.timer || {}) },
        // v4 uses `secondary`, v3 used `external`
        secondary: (typeof m.secondary === 'string' ? m.secondary
                   : typeof m.external === 'string' ? m.external
                   : state.message.secondary),
      };
    }
  }

  function handleMessage(raw) {
    let msg;
    try { msg = JSON.parse(raw); } catch { return; }

    // Ontime v4: { tag: 'runtime-data', payload: Partial<RuntimeStore> }
    //            { tag: 'poll',         payload: RuntimeStore }
    if (msg.tag === 'runtime-data' || msg.tag === 'poll') {
      applyStore(msg.payload);
      return;
    }

    // v4 signals data edits (e.g. rundown renamed) via refetch packets
    if (msg.tag === 'refetch') {
      fetchRundownTitle();
      return;
    }

    // Ontime v3: { type: 'ontime', payload: RuntimeStore } (full store)
    //            { type: 'ontime-auxtimer1' | 'ontime-eventNow' | ..., payload }
    if (typeof msg.type === 'string' && msg.type.startsWith('ontime')) {
      if (msg.type === 'ontime') {
        applyStore(msg.payload);
      } else {
        const key = msg.type.slice('ontime-'.length);
        applyStore({ [key]: msg.payload });
      }
    }
  }

  /* ---------- Rundown name (not in the WS store; fetched over HTTP) ---------- */
  const HTTP_BASE = (IS_HTTPS ? 'https://' : 'http://') + SERVER;

  async function fetchRundownTitle() {
    // v4: current rundown carries the title
    try {
      const res = await fetch(HTTP_BASE + '/data/rundowns/current');
      if (res.ok) {
        const data = await res.json();
        const title = data?.title ?? data?.rundown?.title;
        if (typeof title === 'string' && title.trim()) {
          $rundown.textContent = title;
          return;
        }
      }
    } catch { /* fall through */ }
    // v3 fallback: use the project title
    try {
      const res = await fetch(HTTP_BASE + '/data/project');
      if (res.ok) {
        const data = await res.json();
        if (typeof data?.title === 'string' && data.title.trim()) {
          $rundown.textContent = data.title;
        }
      }
    } catch { /* leave empty */ }
  }

  /* ---------- Host heartbeat: ping every 10 s ---------- */
  // A dropped cable or dead host can leave the WebSocket looking "open"
  // for a long time, so we actively probe the server over HTTP. Any HTTP
  // response (even a 404) counts as alive; only a network failure/timeout
  // flips the dot to red.
  let activeWs = null;

  async function pingHost() {
    if (DEMO) return;
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 4000);
    try {
      await fetch(HTTP_BASE + '/data/project', { signal: ctrl.signal, cache: 'no-store' });
      if (state.connected) setStatus(SERVER + ' · AUX ' + AUX_KEY.slice(-1), 'connected');
    } catch {
      setStatus('No response — ' + SERVER, '');
      // force the socket through a close/reconnect cycle instead of hanging
      if (activeWs && activeWs.readyState === WebSocket.OPEN) activeWs.close();
    } finally {
      clearTimeout(timeout);
    }
  }
  setInterval(pingHost, 10_000);

  /* ---------- WebSocket with auto-reconnect ---------- */
  let retryDelay = 500;

  function connect() {
    setStatus('Connecting — ' + SERVER, '');
    let ws;
    try {
      ws = new WebSocket(WS_URL);
    } catch {
      scheduleReconnect();
      return;
    }

    activeWs = ws;

    ws.onopen = () => {
      retryDelay = 500;
      state.connected = true;
      setStatus(SERVER + ' · AUX ' + AUX_KEY.slice(-1), 'connected');
      $hint.style.display = 'none';
      // Ask for the full state (v4 tag + v3 type, harmless extras are ignored)
      ws.send(JSON.stringify({ tag: 'poll' }));
      ws.send(JSON.stringify({ type: 'poll' }));
      fetchRundownTitle();
    };

    ws.onmessage = (e) => handleMessage(e.data);

    ws.onclose = () => {
      state.connected = false;
      scheduleReconnect();
    };

    ws.onerror = () => ws.close();
  }

  function scheduleReconnect() {
    setStatus('Reconnecting — ' + SERVER, '');
    showHint();
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 5000);
  }

  function showHint() {
    $hint.innerHTML =
      'Cannot reach Ontime at <code>' + SERVER + '</code>.<br>' +
      'Point this page at your server with <code>?server=&lt;ip&gt;:4001</code>' +
      ' &nbsp;·&nbsp; choose a timer with <code>?aux=1|2|3</code>';
    $hint.style.display = 'block';
  }

  /* ---------- Demo mode ---------- */
  function startDemo() {
    setStatus('Demo mode · AUX 1', 'demo');
    $rundown.textContent = 'Awards Gala — Show Day';
    state.eventNow = { cue: '14', title: 'Keynote — Welcome & Opening Remarks', colour: '#3b82f6' };
    state.eventNext = { cue: '15', title: 'Band — Walk-in Music Sting', colour: '#f59e0b', duration: 300_000 };
    state.aux = { duration: 600_000, current: 254_000, playback: 'start', direction: 'count-down' };
    state.auxReceivedAt = performance.now();
    state.timer = { current: 512_000, phase: 'default', playback: 'play' };
    state.timerReceivedAt = performance.now();
    state.message = {
      timer: { text: 'Wrap up — Q&A moves to the lobby', visible: true, blink: false, blackout: false, secondarySource: 'secondary' },
      secondary: 'Mics hot in 30 seconds',
    };
    // Loop the countdown so the demo runs forever
    setInterval(() => {
      if (currentAuxMs() < -15_000) {
        state.aux = { ...state.aux, current: 600_000 };
        state.auxReceivedAt = performance.now();
      }
    }, 1000);
  }

  /* ---------- Fullscreen + cursor ---------- */
  document.addEventListener('dblclick', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  let cursorTimeout;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('hide-cursor');
    clearTimeout(cursorTimeout);
    cursorTimeout = setTimeout(() => document.body.classList.add('hide-cursor'), 3000);
  });
  cursorTimeout = setTimeout(() => document.body.classList.add('hide-cursor'), 3000);

  /* ---------- Go ---------- */
  window.__auxView = state; // debugging hook: inspect live state in the console
  if (DEMO) startDemo();
  else connect();
})();
</script>
</body>
</html>
